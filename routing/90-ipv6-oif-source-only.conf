# Restrict IPv6 source-address selection to the outgoing interface. Without
# this, a v6 default route on an interface with no global IPv6 address (a
# v4-only Wi-Fi advertising RAs) borrows the cellular interface's global
# address as source, which can silently pull reply traffic in over cellular.
# With it, such routes fail closed.
#
# The glob is re-applied per interface on hotplug by the systemd-sysctl udev
# rule in 99-systemd.rules; conf.all is not consulted for this knob and
# conf.default only seeds interfaces created after it is set.
net.ipv6.conf.*.use_oif_addrs_only = 1
net.ipv6.conf.default.use_oif_addrs_only = 1
