# ModemManager does not exit when it is asked to stop while a modem is being
# probed, so systemd waits out its whole stop timeout and kills it. Every
# reboot pays that delay.
#
# Disabling a connected modem kills the in-flight MBIM transactions, its port
# goes uncontrollable, and a fresh modem is probed while the daemon is still
# tearing down. The daemon bounds that teardown with a one-shot timeout, but
# re-checks the modem count after that timeout has fired and been cleaned up,
# so the newly probed modem traps it in a main loop nothing can quit again.
#
# Capping the stop timeout bounds the delay rather than removing it. By the
# time the cap expires the daemon has already abandoned its teardown, and the
# modem is reset by the reboot, so killing it sooner costs nothing.
#
# ExecStart is restated so the low-power suspend/resume flag lives here, not in
# the packaged unit, which a package upgrade overwrites without prompting.
#
# Revert: rm this file, then systemctl daemon-reload.

[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-low-power-suspend-resume
TimeoutStopSec=10s
